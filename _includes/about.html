<div class="about-hero section-heading">
  <h1>ABOUT ME</h1>
  <p class="about-subtitle">{{ site.data.expertise.intro_title }}</p>
  <p class="about-lead">{{ site.data.expertise.lead }}</p>
</div>

<div class="about-focus">
  {% for item in site.data.expertise.highlights %}
  <article class="about-focus__card">
    <div class="about-focus__icon">
      <i class="{{ item.icon }}" aria-hidden="true"></i>
    </div>
    <div class="about-focus__content">
      <div class="about-focus__head">
        <span>{{ item.label }}</span>
        <h2>{{ item.title }}</h2>
      </div>
      <div class="about-focus__tags">
        {% for tag in item.tags %}
        <em>{{ tag }}</em>
        {% endfor %}
      </div>
      <p>{{ item.body }}</p>
    </div>
  </article>
  {% endfor %}
</div>
