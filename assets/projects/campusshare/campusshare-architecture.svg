<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">CampusShare system architecture</title>
  <desc id="desc">CampusShare backend architecture with user, web client, Spring Boot API, JPA repository, MySQL database, Docker Compose, Swagger, GitHub, and IntelliJ.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.54" stop-color="#eef7fb"/>
      <stop offset="1" stop-color="#f5fbf8"/>
    </linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf7fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1f2933" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#3f6f87"/>
    </marker>
    <style>
      .title { font-family: Montserrat, Arial, sans-serif; font-size: 46px; font-weight: 900; fill: #17212d; }
      .subtitle { font-family: Montserrat, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #526170; }
      .label { font-family: Montserrat, Arial, sans-serif; font-size: 22px; font-weight: 900; fill: #17212d; }
      .small { font-family: Montserrat, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #526170; }
      .badge { font-family: Montserrat, Arial, sans-serif; font-size: 13px; font-weight: 900; fill: #2f6f88; }
      .box { fill: #fff; stroke: #bdd8e4; stroke-width: 2; rx: 22; filter: url(#shadow); }
      .group { fill: rgba(255,255,255,0.72); stroke: #6e8796; stroke-width: 4; stroke-dasharray: 18 13; rx: 28; }
      .soft { fill: url(#backend); stroke: #bdd8e4; stroke-width: 2; rx: 20; }
      .arrow { fill: none; stroke: #3f6f87; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrow-dash { fill: none; stroke: #526170; stroke-width: 4; stroke-dasharray: 12 12; stroke-linecap: round; marker-end: url(#arrow); }
      .pill { fill: #e9f5f7; stroke: #bdd8e4; stroke-width: 1.5; rx: 18; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect x="32" y="32" width="1536" height="856" rx="34" fill="#ffffff" opacity="0.72" stroke="#c6dbe7" stroke-width="2"/>

  <text x="76" y="104" class="title">CampusShare Backend Architecture</text>
  <text x="78" y="144" class="subtitle">학업 자료 공유 커뮤니티를 위한 React Client + Spring Boot REST API 구조</text>

  <rect x="70" y="205" width="310" height="430" class="group"/>
  <text x="102" y="246" class="label">Client</text>
  <text x="103" y="274" class="small">사용자 화면 / API 테스트</text>
  <circle cx="225" cy="360" r="54" fill="#fff" stroke="#17212d" stroke-width="8"/>
  <path d="M135 540 C148 466, 302 466, 315 540" fill="none" stroke="#17212d" stroke-width="8" stroke-linecap="round"/>
  <text x="184" y="445" class="label">User</text>
  <rect x="118" y="492" width="214" height="72" class="soft"/>
  <image href="logos/swagger.svg" x="142" y="510" width="42" height="42"/>
  <text x="198" y="523" class="badge">Swagger UI</text>
  <text x="198" y="548" class="small">REST API 문서 확인</text>
  <rect x="118" y="582" width="214" height="72" class="soft"/>
  <image href="logos/react.svg" x="142" y="598" width="42" height="42"/>
  <text x="198" y="612" class="badge">React Client</text>
  <text x="198" y="637" class="small">게시판 / 검색 / 로그인</text>

  <rect x="480" y="210" width="580" height="560" class="group"/>
  <text x="512" y="252" class="label">Spring Boot API Server</text>
  <text x="513" y="280" class="small">Controller - Service - Repository 계층 분리</text>

  <rect x="520" y="318" width="190" height="120" class="box"/>
  <image href="logos/java.svg" x="548" y="338" width="58" height="58"/>
  <text x="622" y="363" class="label">Java</text>
  <text x="622" y="392" class="small">API 구현 언어</text>

  <rect x="764" y="318" width="250" height="120" class="box"/>
  <image href="logos/spring.svg" x="792" y="338" width="62" height="62"/>
  <text x="872" y="363" class="label">Spring Boot</text>
  <text x="872" y="392" class="small">REST Controller / Service</text>

  <rect x="520" y="500" width="220" height="126" class="box"/>
  <text x="550" y="548" class="label">JPA</text>
  <text x="550" y="580" class="small">Entity Mapping</text>
  <text x="550" y="606" class="small">Repository Query</text>

  <rect x="794" y="500" width="220" height="126" class="box"/>
  <text x="824" y="548" class="label">Domain</text>
  <text x="824" y="580" class="small">User / Share</text>
  <text x="824" y="606" class="small">Question / Answer</text>

  <rect x="570" y="665" width="390" height="66" class="pill"/>
  <text x="604" y="706" class="label">REST API</text>
  <text x="748" y="706" class="small">게시글 CRUD, 검색, 사용자 관리, Q&amp;A</text>

  <rect x="1195" y="210" width="310" height="250" class="group"/>
  <text x="1228" y="252" class="label">Database</text>
  <text x="1229" y="280" class="small">Docker Compose로 로컬 실행</text>
  <rect x="1250" y="326" width="200" height="92" class="box"/>
  <image href="logos/mysql.svg" x="1274" y="340" width="88" height="54"/>
  <text x="1374" y="367" class="label">MySQL</text>
  <text x="1374" y="394" class="small">서비스 DB</text>

  <rect x="1195" y="535" width="310" height="235" class="group"/>
  <text x="1228" y="577" class="label">Dev Environment</text>
  <text x="1229" y="605" class="small">구현, 문서화, 실행 환경</text>
  <image href="logos/intellij.svg" x="1230" y="644" width="62" height="62"/>
  <image href="logos/github.svg" x="1320" y="644" width="62" height="62"/>
  <image href="logos/docker.svg" x="1410" y="644" width="62" height="62"/>
  <text x="1231" y="735" class="small">IntelliJ</text>
  <text x="1317" y="735" class="small">GitHub</text>
  <text x="1409" y="735" class="small">Docker</text>

  <path class="arrow-dash" d="M380 520 C420 520, 430 520, 470 520"/>
  <text x="396" y="497" class="small">HTTP Request</text>
  <path class="arrow" d="M1062 404 C1110 404, 1140 386, 1184 374"/>
  <text x="1078" y="374" class="small">JPA Query</text>
  <path class="arrow-dash" d="M1350 460 L1350 526"/>
  <text x="1370" y="503" class="small">compose</text>
  <path class="arrow-dash" d="M1192 650 C1130 650, 1110 650, 1040 650"/>
  <text x="1084" y="629" class="small">develop / build</text>

  <rect x="88" y="718" width="400" height="96" rx="20" fill="#edf7fb" stroke="#bdd8e4"/>
  <image href="logos/html5.svg" x="122" y="744" width="44" height="44"/>
  <image href="logos/css3.svg" x="190" y="744" width="44" height="44"/>
  <image href="logos/javascript.svg" x="258" y="744" width="44" height="44"/>
  <image href="logos/react.svg" x="326" y="744" width="44" height="44"/>
  <text x="392" y="760" class="badge">Frontend</text>
  <text x="392" y="786" class="small">React, HTML, CSS, JavaScript</text>
</svg>
