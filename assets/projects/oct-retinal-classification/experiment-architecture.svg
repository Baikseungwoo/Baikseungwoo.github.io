<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">OCT classification experiment architecture</title>
  <desc id="desc">Pipeline from OCT2017 dataset to preprocessing, model comparison, and evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f9fc"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#3d6d99"/>
      <stop offset="1" stop-color="#5b7fb0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1a222c" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#3d6d99"/>
    </marker>
  </defs>
  <rect width="1280" height="620" rx="32" fill="url(#bg)"/>
  <text x="70" y="72" font-family="Montserrat, Arial, sans-serif" font-size="34" font-weight="800" fill="#17212d">Retinal OCT Classification Pipeline</text>
  <text x="70" y="108" font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#536273">Baseline CNN vs SE-ResBlock OCTNet under the same split, transform, and evaluation criteria.</text>

  <g filter="url(#shadow)" font-family="Montserrat, Arial, sans-serif">
    <rect x="70" y="165" width="190" height="130" rx="20" fill="#ffffff" stroke="#d7e4ee"/>
    <circle cx="112" cy="210" r="22" fill="#edf5fb"/>
    <path d="M96 215c18-38 42-39 57-6-21-10-38-5-57 6z" fill="#3d6d99"/>
    <text x="94" y="255" font-size="19" font-weight="800" fill="#17212d">OCT2017</text>
    <text x="94" y="280" font-size="13" fill="#536273">CNV / DME / DRUSEN / NORMAL</text>

    <rect x="330" y="165" width="190" height="130" rx="20" fill="#ffffff" stroke="#d7e4ee"/>
    <rect x="372" y="190" width="52" height="52" rx="14" fill="#edf5fb"/>
    <path d="M383 216h30M398 201v30" stroke="#3d6d99" stroke-width="8" stroke-linecap="round"/>
    <text x="354" y="255" font-size="19" font-weight="800" fill="#17212d">Preprocess</text>
    <text x="354" y="280" font-size="13" fill="#536273">Grayscale, resize, normalize</text>

    <rect x="590" y="165" width="190" height="130" rx="20" fill="#ffffff" stroke="#d7e4ee"/>
    <rect x="630" y="190" width="52" height="52" rx="14" fill="#edf5fb"/>
    <path d="M641 230c20-40 42-40 62 0M642 201h58" fill="none" stroke="#3d6d99" stroke-width="7" stroke-linecap="round"/>
    <text x="614" y="255" font-size="19" font-weight="800" fill="#17212d">Augment</text>
    <text x="614" y="280" font-size="13" fill="#536273">Crop, flip, rotation</text>

    <rect x="850" y="120" width="190" height="130" rx="20" fill="#ffffff" stroke="#d7e4ee"/>
    <rect x="890" y="145" width="52" height="52" rx="14" fill="#edf5fb"/>
    <path d="M899 183h36M907 172h20M907 160h28" stroke="#3d6d99" stroke-width="7" stroke-linecap="round"/>
    <text x="874" y="210" font-size="19" font-weight="800" fill="#17212d">Baseline CNN</text>
    <text x="874" y="235" font-size="13" fill="#536273">4 convolution blocks</text>

    <rect x="850" y="310" width="190" height="130" rx="20" fill="#ffffff" stroke="#d7e4ee"/>
    <rect x="890" y="335" width="52" height="52" rx="14" fill="#edf5fb"/>
    <path d="M896 361c14-25 36-25 50 0M902 376h36" fill="none" stroke="#3d6d99" stroke-width="7" stroke-linecap="round"/>
    <text x="874" y="400" font-size="19" font-weight="800" fill="#17212d">SE-ResBlock</text>
    <text x="874" y="425" font-size="13" fill="#536273">Residual + channel attention</text>

    <rect x="1090" y="215" width="130" height="140" rx="20" fill="url(#blue)"/>
    <text x="1116" y="270" font-size="19" font-weight="800" fill="#fff">Evaluate</text>
    <text x="1116" y="298" font-size="13" fill="#eef7ff">Accuracy</text>
    <text x="1116" y="320" font-size="13" fill="#eef7ff">F1-score</text>
    <text x="1116" y="342" font-size="13" fill="#eef7ff">Confusion Matrix</text>
  </g>

  <g stroke="#3d6d99" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M260 230h64"/>
    <path d="M520 230h64"/>
    <path d="M780 230c42 0 46-45 70-45"/>
    <path d="M780 230c42 0 46 145 70 145"/>
    <path d="M1040 185c38 0 42 70 50 90"/>
    <path d="M1040 375c38 0 42-70 50-90"/>
  </g>

  <g font-family="Montserrat, Arial, sans-serif">
    <rect x="250" y="495" width="780" height="58" rx="29" fill="#ffffff" stroke="#d7e4ee"/>
    <text x="290" y="531" font-size="18" font-weight="800" fill="#17212d">Result:</text>
    <text x="358" y="531" font-size="18" fill="#344154">Baseline 0.94 test accuracy -> Improved model 0.99 test accuracy (+5%p)</text>
  </g>
</svg>
