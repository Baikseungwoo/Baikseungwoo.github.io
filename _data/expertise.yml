# Expertise section below the hero (icons use Devicon classes bundled in main.css).
intro_title: About Me

sections:
  - title: AI & Data
    body: >-
      AI 모델을 서비스 흐름에 연결하는 데 관심이 있습니다. LangChain,
      LangGraph, ChromaDB 기반 RAG 구조, NLP 구조화, 모델 평가,
      PySpark 데이터 처리 경험을 쌓고 있습니다.
    icons:
      - devicon-python-plain colored
      - devicon-mongodb-plain colored
      - devicon-linux-plain colored

  - title: Service Development
    body: >-
      React, Spring Boot, FastAPI, Android 기반 프로젝트를 통해
      프론트엔드, 백엔드 API, 모바일 앱, 데이터 저장 구조를 함께
      설계하고 구현합니다.
    icons:
      - devicon-react-original colored
      - devicon-java-plain colored
      - devicon-android-plain colored
      - devicon-javascript-plain colored

  - title: Cloud & DevOps
    body: >-
      GitHub Actions, Docker, AWS EC2를 활용해 프론트엔드와 백엔드
      서비스를 분리 배포하고, 실습과 팀 프로젝트에서 CI/CD 흐름을
      경험했습니다.
    icons:
      - devicon-docker-plain colored
      - devicon-git-plain colored
      - devicon-amazonwebservices-original colored
      - devicon-linux-plain colored
