        image: /assets/projects/tuktak/appendix-erd.png
        caption: 사용자, 견적, 리포트, 매칭, 시공자 제안, 주문, 리뷰, 알림, RAG 문서 구조를 중심으로 데이터 모델을 설계했습니다.
      - title: NLP 구조화 정확도 평가
        image: /assets/projects/tuktak/appendix-total-flow.png
        caption: KLUE-RoBERTa, KoELECTRA, Qwen2.5-Instruct를 비교해 구조화 성능과 처리 시간을 기준으로 최종 모델을 선정했습니다.
      - title: NLP 예외 케이스 평가
        image: /assets/projects/tuktak/appendix-nlp-validation.png
        caption: 모호한 입력, 가격 질문, 위험 요청, 정보 부족 입력을 검증하며 Rule-Engine 보완 필요성을 도출했습니다.
      - title: OpenCV 사진 전처리 평가
        image: /assets/projects/tuktak/appendix-comparison.png
        caption: 조명 불량, 흐림, 정상 사진을 분류하는 전처리 기준을 실험해 Vision LLM 전달 전 품질 검증 단계를 설계했습니다.
    troubleshooting_items:
      - title: 프로젝트 관리 방식 전환
        logo: /assets/projects/tuktak/logos/jira.svg
        logo_alt: Jira
        problem: Notion 기반 기록만으로는 일정, 산출물, 담당자, 작업 상태를 명확하게 추적하기 어려웠습니다.
        solution: Jira를 도입해 Epic, Sprint, Task 단위로 작업을 쪼개고 우선순위와 진행 상태를 관리했습니다.
      - title: AI 모델 배포 과부하
        logo: /assets/projects/tuktak/logos/huggingface.svg
        logo_alt: Hugging Face
        problem: Fine-tuning 모델을 직접 운영하는 경우 초기 인프라 비용과 운영 부담이 커질 수 있었습니다.
        solution: Hugging Face repo를 활용해 모델 관리 방식을 정리하고, 초기 서비스는 GPT-5 mini와 외부 API 중심으로 검증하도록 설계했습니다.
      - title: RAG 검색 품질 저하
        logo: /assets/projects/tuktak/logos/langchain.svg
        logo_alt: LangChain
        problem: LangChain 기본 임베딩 모델 사용 시 한국어 리스크 문서 검색 결과가 부정확했습니다.
        solution: 임베딩 모델 성능평가를 직접 수행하고 Ko-SRoBERTa로 교체해 한국어 문서 검색 품질을 개선했습니다.
      - title: AI 견적 신뢰성
        logo: /assets/projects/tuktak/logos/openai.svg
        logo_alt: OpenAI
        problem: LLM 단독 추론은 임의 가격 생성과 JSON 형식 오류가 발생할 수 있었습니다.
        solution: 표준 단가표, 유사 사례 검색, 필수 Key 검증, 가격 범위 후처리를 함께 적용해 견적 응답 안정성을 높였습니다.
