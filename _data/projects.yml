intro_title: Feature Projects
intro_body: |-
  AI 서비스, 모바일 AI, 딥러닝 모델링, 빅데이터 처리, 백엔드 API 구현 경험을 프로젝트 단위로 정리했습니다.

items:
  - title: TUKTAK AI
    category: AI Service
    tone: ai
    detail_path: /projects/tuktak-ai/
    period: "2026.05~2026.07"
    role: 팀장 / 서비스 총괄 설계 / AI·Backend·CI/CD 리딩
    summary: 사진과 자연어 설명만으로 집수리 예상 견적, 리스크 리포트, 역경매 매칭까지 연결한 AI 기반 집수리 견적 및 시공자 매칭 플랫폼입니다.
    problem: 집수리 시장은 가격 기준이 불투명하고, 사용자는 추가 비용·시공 리스크·시공자 신뢰도를 사전에 판단하기 어렵습니다. TukTak은 사진과 설명을 기반으로 AI 기준 견적과 리스크 정보를 먼저 제공하고, 이후 시공자 제안 비교까지 이어지는 흐름으로 정보 비대칭을 줄이는 것을 목표로 설계했습니다.
    architecture: React 프론트엔드, FastAPI 백엔드, AI 마이크로서비스, MySQL/RDS, ChromaDB, S3 이미지 저장소를 분리했습니다. Route 53과 CloudFront로 사용자 트래픽을 라우팅하고, Backend와 AI 서비스는 Docker 이미지 기반으로 ECR/ECS에 배포하는 구조로 잡았습니다.
    development: 팀장으로서 전체 서비스 흐름, MVP 범위, 화면 명세서, ERD, API 명세서를 설계했습니다. AI 견적, 리스크 리포트, 역경매 매칭, 시공자 견적 발송/선택, 1:1 채팅, 알림, 시공 이력 관리까지 이어지는 도메인 흐름을 정의하고 각 파트의 개발 기준을 맞췄습니다.
    deployment: GitHub Actions 기반 CI/CD를 구성하고, 프론트엔드는 S3와 CloudFront, 백엔드·AI 서비스는 Docker, ECR, ECS 중심으로 배포 흐름을 설계했습니다. 이미지 원본은 Amazon S3에 저장하고 URL 기반으로 서비스 간 통신하도록 구성했습니다.
    troubleshooting: 프로젝트 기록 중심의 Notion 관리만으로는 일정, 이슈, 작업 분배를 추적하기 어려워 Jira를 도입했습니다. AI 모델 배포 과부하 문제는 Hugging Face repo를 활용해 모델 관리 방식을 정리했고, RAG 검색 품질 저하는 임베딩 모델 성능평가 후 Ko-SRoBERTa로 교체해 개선했습니다.
    result: AI 견적, RAG 리스크 리포트, 역경매 매칭, AWS 배포, Jira 기반 프로젝트 관리까지 하나의 실서비스 흐름으로 연결했습니다. 팀장으로서 서비스 설계와 산출물 기준을 먼저 세우고, 팀원들이 병렬로 구현할 수 있도록 API/DB/화면 흐름을 정리했습니다.
    highlights:
      - 팀장으로서 전체 서비스 흐름, 기술 스택 선정, API 명세, ERD, 화면 명세서, CI/CD 구조를 설계했습니다.
      - LangGraph 기반으로 입력 검증, NLP 구조화, 유사 사례 검색, Vision LLM 견적 생성, 결과 검증 단계를 구성했습니다.
      - AWS S3, CloudFront, Route 53, ECR, ECS, RDS를 활용해 프론트엔드·백엔드·AI 서비스를 분리 배포하는 구조를 잡았습니다.
      - Jira를 도입해 Epic, Sprint, Task 단위로 프로젝트를 관리하고 실무에 가까운 협업 흐름을 만들었습니다.
    metrics:
      - label: 최종 NLP 모델
        value: KLUE-RoBERTa
      - label: 평균 정확도
        value: "86.4%"
      - label: 실시간 추론
        value: "0.014s"
      - label: 발표자료
        value: "48 pages"
    problem_visual:
      title: TukTak 차별화 포인트
      image: /assets/projects/tuktak/appendix-erd-detail.png
      caption: 사진 기반 AI 견적, 리스크 리포트, 역경매 비교, 고객-시공자 직접 채팅을 핵심 차별점으로 정리했습니다.
    architecture_visual:
      title: TukTak 배포 시스템 아키텍처
      image: /assets/projects/tuktak/tuktak-system-architecture.png
      caption: 서비스 요청 흐름과 GitHub Actions 기반 프론트엔드·백엔드·AI 서비스 배포 흐름을 하나의 구조로 설계했습니다.
    ai_visuals:
      - title: AI 자동 견적 서비스
        image: /assets/projects/tuktak/ai-estimate-detail.png
        caption: LangGraph로 입력 검증, NLP 구조화, 유사 사례 검색, Vision LLM 견적 생성을 단계화했습니다.
      - title: 자연어 처리 모델 검증
        image: /assets/projects/tuktak/rag-risk-flow.png
        caption: NLP/LLM 후보 모델을 정량 평가해 한국어 구조화와 서비스 비용에 맞는 모델을 선정했습니다.
    management_visual:
      title: Jira 프로젝트 관리
      image: /assets/projects/tuktak/appendix-feature-comparison.png
      caption: 팀장으로서 Jira를 선택해 Epic, Sprint, Task 단위로 역할과 일정을 관리했습니다.
    architecture_nodes:
      - icon: fa fa-users
        title: User Flow
        body: 고객은 사진과 설명을 입력하고 AI 견적, 리스크 리포트, 시공자 제안 비교를 순서대로 확인합니다.
      - icon: devicon-react-original
        title: Frontend
        body: React 기반 화면에서 견적 요청, 리포트 조회, 매칭 진행, 시공 이력 확인 흐름을 제공합니다.
      - icon: devicon-fastapi-plain
        title: Backend API
        body: FastAPI 도메인 라우터로 사용자, 견적, 리포트, 매칭, 견적 제안, 알림 API를 분리했습니다.
      - icon: fa fa-database
        title: Data Layer
        body: MySQL/RDS를 중심으로 ERD를 설계하고, 이미지 원본은 Amazon S3에 저장했습니다.
      - icon: fa fa-cloud
        title: AI Service
        body: LangGraph, ChromaDB, Vision LLM, NLP 모델을 분리된 AI 서비스로 구성했습니다.
      - icon: devicon-amazonwebservices-original
        title: AWS Deploy
        body: Route 53, CloudFront, S3, ECR, ECS, RDS로 서비스 운영 흐름을 구성했습니다.
    ai_pipeline:
      - icon: fa fa-check-circle
        title: 입력 유효성 검사
        body: OpenCV와 Rule-Engine으로 사진 품질, 조도, 흔들림, 설명 텍스트 유효성을 먼저 검사했습니다.
      - icon: fa fa-code
        title: NLP 구조화
        body: KLUE-RoBERTa fine-tuning 기반으로 main_category, object_label, problem_label, repair_task, missing_info를 JSON으로 구조화했습니다.
      - icon: fa fa-search
        title: 유사 사례 검색
        body: ChromaDB와 Nomic Embed Vision을 활용해 기존 시공 사례를 검색하고 코사인 유사도와 변동계수를 기준으로 판단했습니다.
      - icon: fa fa-magic
        title: 견적 생성
        body: 유사 사례가 부족한 경우 자체 단가표와 GPT-5 mini를 함께 사용해 예상 가격과 작업 시간을 생성했습니다.
      - icon: fa fa-file-text-o
        title: RAG 리스크 리포트
        body: 소비자원 피해사례, 공정위 표준계약서 등 공신력 있는 문서를 임베딩해 공사별 위험 요소와 체크리스트를 생성했습니다.
    aws_pipeline:
      - icon: devicon-github-original
        title: GitHub Actions
        body: 브랜치 변경을 기준으로 프론트엔드와 백엔드 배포 파이프라인을 자동화했습니다.
      - icon: devicon-docker-plain
        title: Docker Image
        body: Backend와 AI Service를 컨테이너 이미지로 패키징해 실행 환경 차이를 줄였습니다.
      - icon: devicon-amazonwebservices-original
        title: ECR / ECS
        body: 빌드된 이미지를 ECR에 저장하고 ECS에서 백엔드·AI 서비스를 운영하는 구조로 설계했습니다.
      - icon: fa fa-cloud-upload
        title: S3 / CloudFront
        body: 프론트엔드 정적 파일과 이미지 저장소를 S3로 분리하고 CloudFront로 사용자 응답 속도를 높였습니다.
      - icon: fa fa-server
        title: RDS / Network
        body: MySQL 데이터베이스를 RDS로 구성하고 VPC 내부에서 백엔드와 AI 서비스가 연동되도록 설계했습니다.
    leadership:
      - title: 서비스 설계 총괄
        body: 문제 정의, 사용자 흐름, MVP 범위, 주요 기능 우선순위, 시연 흐름을 정리했습니다.
      - title: 산출물 제작
        body: 화면 명세서, ERD, API 명세서, 서비스 아키텍처, AI 파이프라인 설계를 주도했습니다.
      - title: 기술 의사결정
        body: React, FastAPI, LangGraph, ChromaDB, AWS ECS/ECR/S3/CloudFront/RDS 중심의 기술 구조를 선정했습니다.
      - title: 프로젝트 관리
        body: Notion 기록식 관리의 한계를 보완하기 위해 Jira를 선택하고 Epic, Sprint, Task 기준으로 팀 작업을 관리했습니다.
    deliverables:
      - icon: fa fa-desktop
        title: 화면 명세서
      - icon: fa fa-sitemap
        title: System Architecture
      - icon: fa fa-database
        title: ERD
