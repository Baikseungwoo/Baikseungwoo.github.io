        problem: GPT 응답이 자유 문장으로 오면 앱에서 뜻과 예문을 안정적으로 카드에 매핑하기 어렵습니다.
        solution: Cloud Function에서 strict JSON 형태로 의미, 영어 예문, 한국어 번역을 받도록 설계하고 RoomDB와 Firestore 저장 흐름에 연결했습니다.
