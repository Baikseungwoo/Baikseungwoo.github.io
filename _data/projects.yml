intro_title: 주요 프로젝트
intro_body: |-
  AI 서비스, 모바일 AI, 딥러닝 모델링, 빅데이터 처리, 백엔드 API 구현 경험을 프로젝트 단위로 정리했습니다.

items:
  - title: TUKTAK AI
    category: AI Service
    tone: ai
    detail_path: /projects/tuktak-ai/
    period: "2026.05~2026.07"
    role: 팀장 / AI 파이프라인 / CI/CD 설계
    summary: 사진과 자연어 설명을 기반으로 집수리 견적, 리스크 리포트, 시공자 매칭까지 연결한 AI 집수리 플랫폼입니다.
    problem: 집수리 시장의 가격 불투명성과 사용자 정보 부족 문제를 해결하기 위해, 사용자가 사진과 설명만으로 예상 견적과 리스크를 확인하고 시공자 매칭까지 이어질 수 있는 서비스를 설계했습니다.
    architecture: Frontend, Backend, AI Service를 분리하고 FastAPI 도메인 라우터, MySQL 데이터 모델, LangGraph AI 파이프라인을 연결하는 구조로 설계했습니다.
    development: 회원가입/로그인, 견적 요청, AI 리스크 리포트, 매칭 요청, 시공자 견적 발송/선택, 마이페이지를 MVP 범위로 정의하고 각 파트의 API 계약과 데이터 흐름을 정리했습니다.
    deployment: 프론트엔드는 S3와 CloudFront, 백엔드와 AI 서비스는 Docker 이미지 기반 ECR/ECS 배포 흐름으로 구성했습니다. Git Actions와 AWS OIDC 인증을 활용해 장기 Access Key 노출을 줄였습니다.
    troubleshooting: LLM이 임의 가격을 생성하지 않도록 표준 단가표와 유사 사례를 제한적으로 주입하고, 가격 범위와 필수 JSON Key를 검증하는 후처리 규칙을 적용했습니다.
    result: AI 견적, 리스크 분석, 시공자 매칭, 역경매 견적 비교까지 이어지는 전체 서비스 구조를 설계하고 팀 단위 병렬 개발이 가능한 기준을 마련했습니다.
    highlights:
      - MVP 범위, 사용자 흐름, API/DB 구조, AI 견적 파이프라인, CI/CD 배포 구조를 총괄했습니다.
      - LangGraph 기반으로 입력 검증, 이미지 품질 검사, NLP 구조화, 유사 사례 검색, 견적 생성, 결과 검증 단계를 구성했습니다.
      - Git Actions, Docker, AWS ECS/ECR/S3/CloudFront/RDS 기반으로 프론트엔드, 백엔드, AI 서비스를 분리 배포했습니다.
    stack:
      - React
      - FastAPI
      - LangGraph
      - ChromaDB
      - Docker
      - AWS
    link: https://github.com/TUKTAKxAI
    presentation_url: https://canva.link/m5n77930osszn9p
    presentation_pdf: /assets/projects/tuktak-ai.pdf

  - title: Chalkak App
    category: Mobile AI
    tone: mobile
    detail_path: /projects/chalkak-app/
    period: "2025.09~2025.12"
    role: 객체 인식 모델 임베딩 / 학습 플로우 연동
    summary: 온디바이스 객체 인식을 영어 단어 학습, GPT 예문 생성, 발음 학습, 퀴즈 복습으로 연결한 Android 앱입니다.
    problem: 어린이가 일상 속 사물을 직접 촬영하며 영어 단어를 학습할 수 있도록, 단순 암기보다 사진 기반 경험으로 이어지는 학습 흐름을 만들고자 했습니다.
    architecture: Android 앱 내부에 TensorFlow Lite 모델을 포함하고, Room DB와 Firestore를 함께 사용하는 Local-first 구조로 학습 데이터를 관리했습니다.
    development: ObjectDetectionHelper를 구현해 모델 로드, 이미지 변환, 추론 과정을 모듈화하고 Label, Confidence Score, Bounding Box 결과를 학습 화면과 연결했습니다.
    deployment: 모바일 앱 내부에서 객체 인식이 동작하도록 모델을 assets에 포함했고, Firebase Authentication, Firestore, Functions, Cloud Messaging을 연동했습니다.
    troubleshooting: 신규 단어나 예문이 부족한 경우에만 GPT API를 호출하도록 구성해 중복 요청을 줄이고, Room DB와 Firestore 동기화 기준을 분리했습니다.
    result: 사진 촬영, 객체 인식, 단어/예문 학습, 발음 연습, 퀴즈 복습까지 앱 안에서 이어지는 모바일 AI 학습 플로우를 완성했습니다.
    highlights:
      - TensorFlow Lite 객체 인식 모델을 Android 앱에 임베딩하고 ObjectDetectionHelper로 추론 과정을 모듈화했습니다.
      - Label, Confidence Score, Bounding Box 결과를 단어 학습 플로우와 연결했습니다.
      - Room DB, Firestore, Firebase Functions, OpenAI API를 함께 활용해 로컬 우선 학습 데이터를 구성했습니다.
    stack:
      - Kotlin
      - Android
      - TensorFlow Lite
      - Firebase
      - Room DB
      - OpenAI API
    link: https://github.com/chalkak-itm
    presentation_url: https://canva.link/wxyy36liv3mgimr
    presentation_pdf: /assets/projects/chalkak-app.pdf

  - title: OCT Retinal Disease Classification
    category: Deep Learning
    tone: deep
    detail_path: /projects/oct-retinal-classification/
    period: "2025.10~2025.11"
    role: 개인 프로젝트 / CNN 모델 설계 / 성능 비교
    summary: OCT 망막 이미지를 4개 클래스로 분류하고 SE-Residual 구조로 테스트 정확도를 약 99%까지 개선한 딥러닝 프로젝트입니다.
    problem: OCT 망막 이미지는 질환별 차이가 미세해 단순 CNN만으로는 클래스 간 혼동이 발생할 수 있어, 특징 추출 성능을 높이는 모델 구조가 필요했습니다.
    architecture: Baseline CNN과 SE-Residual 기반 개선 모델을 같은 데이터 분할과 학습 조건에서 비교하는 실험 구조로 설계했습니다.
    development: 학습 이미지를 Train/Validation으로 나누고 Grayscale, Resize, 정규화, RandomResizedCrop, Flip, Rotation 증강을 적용했습니다.
    deployment: 서비스 배포보다는 Jupyter Notebook 기반 실험 환경에서 모델 학습, 검증, 성능 지표 산출까지 재현 가능한 형태로 정리했습니다.
    troubleshooting: 시각적으로 유사한 CNV와 DME 간 오분류를 줄이기 위해 Residual Connection과 SE Block을 적용해 채널별 중요 특징에 집중하도록 개선했습니다.
    result: Baseline 약 94%에서 SE-Residual 개선 모델 약 99% 테스트 정확도를 달성하고 Confusion Matrix로 오분류 패턴을 분석했습니다.
    highlights:
      - OCT2017 데이터셋을 학습/검증/테스트 기준으로 구성하고 이미지 전처리와 증강을 적용했습니다.
      - Baseline CNN과 SE-Residual 기반 개선 모델을 동일 조건에서 비교했습니다.
      - Accuracy, Precision, Recall, F1-score, Confusion Matrix로 모델 성능을 분석했습니다.
    stack:
      - Python
      - PyTorch
      - CNN
      - Jupyter
      - CUDA/GPU
    link: https://drive.google.com/file/d/1QKTKYXi_Ljb7BH3T6wlZ2P0IbtnUNoPB/view?usp=sharing
    presentation_url: https://drive.google.com/file/d/1QKTKYXi_Ljb7BH3T6wlZ2P0IbtnUNoPB/view?usp=sharing
    presentation_pdf: /assets/projects/oct-retinal-classification.pdf

  - title: New York Taxi Big Data Processing
    category: Big Data
    tone: data
    detail_path: /projects/nyc-taxi-big-data/
    period: "2025.09~2025.12"
    role: HDFS 적재 / PySpark 전처리 / TLI-CI 산출
    summary: 약 30GB 뉴욕 택시/교통 데이터를 HDFS와 PySpark 기반 파이프라인으로 처리한 빅데이터 분석 프로젝트입니다.
    problem: 대용량 택시 운행 데이터와 교통 속도 데이터를 함께 처리해 이동 시간 변동성과 혼잡도를 분석할 수 있는 데이터 파이프라인이 필요했습니다.
    architecture: Hadoop HDFS에 원천 데이터를 적재하고 Bronze, Silver, Gold Layer로 전처리와 분석용 Mart 생성을 분리했습니다.
    development: PySpark로 CSV를 Parquet으로 변환하고, 이상치 제거, 시간 블록 생성, Taxi Zone Lookup 조인, Borough 기준 집계를 수행했습니다.
    deployment: VMware Linux VM 기반 분석 환경에서 HDFS 저장소를 구성하고, 저장공간 부족 문제를 해결하기 위해 디스크를 확장하고 HDFS Data Directory를 재설정했습니다.
    troubleshooting: 기본 VM 디스크 용량으로는 약 30GB 데이터를 처리하기 어려워 200GB 디스크를 추가하고 파티션 마운트, 권한, HDFS 경로 문제를 해결했습니다.
    result: 원천 데이터 적재부터 최종 분석용 Mart 생성까지 데이터 엔지니어링 전 과정을 구현하고 TLI/CI 지표를 산출했습니다.
    highlights:
      - Hadoop HDFS 기반 저장 환경을 구성하고 VMware 저장공간 문제를 직접 해결했습니다.
      - Bronze-Silver-Gold Layer 구조로 원천 보존, 전처리, 파생 변수 생성, 최종 집계를 분리했습니다.
      - TLI와 CI 지표를 산출해 택시 이동 시간 변동성과 혼잡도를 분석했습니다.
    stack:
      - Hadoop
      - HDFS
      - PySpark
      - Spark SQL
      - Python
      - Linux VM
    link: https://docs.google.com/presentation/d/1ggftALXueGg85IgzxbEmJn8PwVdj5SMl4ARLWOlZ8QM/edit?usp=sharing
    presentation_url: https://docs.google.com/presentation/d/1ggftALXueGg85IgzxbEmJn8PwVdj5SMl4ARLWOlZ8QM/edit?usp=sharing
    presentation_pdf: /assets/projects/nyc-taxi-big-data.pdf

  - title: CampusShare
    category: Backend API
    tone: backend
    detail_path: /projects/campusshare/
    period: "2024.09~2024.12"
    role: Spring Boot API / JPA 설계 / Swagger 문서화
    summary: 강의 자료 공유와 Q&A 기능을 제공하는 캠퍼스 지식 공유 플랫폼의 백엔드 API를 구현했습니다.
    problem: 학생들이 강의 자료, 과제 팁, 질문과 답변을 공유할 수 있는 학업 커뮤니티 플랫폼의 안정적인 백엔드 API가 필요했습니다.
    architecture: User, Share, Question, Answer 도메인을 분리하고 Controller, Service, Repository 계층으로 책임을 나누었습니다.
    development: 자료 등록, 전체 조회, 제목 검색, 다운로드 카운트 증가, 질문 등록, 답변 등록/조회/삭제 API를 구현했습니다.
    deployment: MySQL을 Docker Compose로 실행하고 Swagger/OpenAPI를 적용해 프론트엔드와 연동 가능한 API 문서를 제공했습니다.
    troubleshooting: 게시물, 질문, 답변, 사용자 간 연관관계를 명확히 나누고 응답 구조를 일관되게 정리해 프론트엔드 연동 혼선을 줄였습니다.
    result: 자료 공유와 Q&A를 포함한 핵심 백엔드 API를 구현하고, 문서화와 로컬 실행 환경을 통해 협업 편의성을 높였습니다.
    highlights:
      - User, Share, Question, Answer 도메인을 분리하고 Controller-Service-Repository 계층으로 구성했습니다.
      - 자료 등록, 조회, 검색, 다운로드 카운트 증가, 질문/답변 API를 구현했습니다.
      - Swagger/OpenAPI와 Docker Compose를 적용해 프론트엔드 연동과 로컬 테스트 편의성을 높였습니다.
    stack:
      - Java
      - Spring Boot
      - JPA
      - MySQL
      - Swagger
      - Docker Compose
    link: https://github.com/mmuhunn/CampusShare
    presentation_url: https://canva.link/u1aqszltue6oiv4
    presentation_pdf: /assets/projects/campusshare.pdf
