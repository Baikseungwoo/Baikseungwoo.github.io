  - title: Chalkak App
    category: Mobile AI
    tone: mobile
    detail_path: /projects/chalkak-app/
    period: "2025.09~2025.12"
    role: 객체 인식 모델 연동 / TTS 기능 / 가속도 센서 기반 Quick Snap 구현
    summary: 아이들이 주변 사물을 직접 찍으며 영어를 익힐 수 있도록, 사진 속 객체를 영어 단어 카드, GPT 예문, 발음 연습, 퀴즈 복습으로 연결한 Android AI 학습 앱입니다.
    problem: Chalkak은 아이를 위한 사진 기반 영어 공부 앱입니다. 단어장을 외우는 방식은 실제 사물과 학습 맥락이 분리되기 쉬워, 사용자가 직접 촬영한 사물을 학습 카드로 바꾸고 예문·발음·복습까지 이어지는 모바일 학습 흐름으로 설계했습니다.
    architecture: Single Activity와 Multi Fragment 구조를 기반으로 Home, Log, Quiz, Settings, Magic Adventure 화면을 분리했습니다. 앱 내부에는 TensorFlow EfficientDet-Lite0 모델을 포함하고, Room DB와 Firestore를 함께 사용해 로컬 우선 학습 기록과 클라우드 사용자 데이터를 관리했습니다.
    deployment: 객체 인식은 Android 앱 내부 assets에 포함된 TensorFlow Lite 모델로 온디바이스 추론되며, Firebase Authentication, Firestore, Cloud Functions, Cloud Messaging을 연동해 로그인, 토큰 저장, GPT 예문 생성, 알림 흐름을 구성했습니다.
    role_title: 담당 구현 범위
    development: 담당 범위는 객체 인식 모델을 카메라·갤러리 이미지 흐름과 연결하는 작업, 영어 단어/예문을 읽어주는 TTS 기능, 흔들기 동작으로 카메라를 실행하는 가속도 센서 기능이었습니다. ObjectDetectionHelper를 통해 모델 로딩, 이미지 전처리, 추론 결과 파싱, Label·Confidence·Bounding Box 전달 과정을 분리해 학습 화면에서 바로 사용할 수 있게 구현했습니다.
    ai_title: 사진에서 단어 카드까지
    troubleshooting: 카메라 URI, 온디바이스 모델 추론, 음성 기능, GPT 예문 생성, 로컬/클라우드 저장 흐름이 한 화면 경험 안에서 이어져야 했기 때문에 각 기능의 책임을 분리하고 실패 지점을 화면 흐름에 맞춰 처리했습니다.
    result: 촬영 또는 갤러리 선택, 객체 인식, 단어 카드 생성, GPT 예문 확인, TTS/STT 발음 연습, 캘린더 기록, 퀴즈 복습까지 이어지는 모바일 AI 영어 학습 프로토타입을 완성했습니다.
