      - title: TensorFlow Lite 추론 결과 연결
        logo: /assets/projects/chalkak/logos/tensorflow.svg
        logo_alt: TensorFlow
        problem: 모델 추론 결과를 단순 label로만 쓰면 학습 화면에서 객체 위치와 신뢰도를 함께 보여주기 어렵습니다.
        solution: label, confidence score, bounding box를 함께 전달하도록 결과 구조를 정리하고, 화면에서 감지 영역과 학습 정보를 함께 표시했습니다.
      - title: Android Camera URI 처리
        logo: /assets/projects/chalkak/logos/android.svg
        logo_alt: Android
        problem: 카메라 촬영 파일과 갤러리 선택 파일의 URI 처리 방식이 달라 이미지 입력 흐름이 분기되었습니다.
        solution: Activity Result API와 FileProvider 기반 content URI를 사용해 촬영·선택 이미지를 동일한 추론 플로우로 넘기도록 구성했습니다.
      - title: Firebase 인증과 알림 토큰
        logo: /assets/projects/chalkak/logos/firebase.svg
