  - title: New York Taxi Big Data Processing
    category: Big Data
    tone: data
    detail_path: /projects/nyc-taxi-big-data/
    period: "2025.09~2025.12"
    role: HDFS 적재 / Spark Layer 설계 / TLI-CI 분석
    summary: NYC Yellow Taxi, Traffic Speed, Taxi Zone 데이터를 Hadoop HDFS와 PySpark 기반 레이어드 파이프라인으로 처리하고 Taxi Luck Index와 Congestion Index를 산출한 빅데이터 프로젝트입니다.
    overview_title: 택시 운행 데이터에서 TLI 분석까지
    problem: 같은 출발지, 시간대, 경로처럼 보이는 택시 이동도 실제 소요 시간은 크게 흔들립니다. 이 프로젝트는 약 30GB 규모의 NYC 택시/교통 데이터를 처리해 이동 시간의 불확실성을 Taxi Luck Index로 정량화하고, 교통 혼잡도와 함께 분석할 수 있는 데이터 파이프라인을 구현했습니다.
    architecture_label: Data Pipeline
    architecture_title: HDFS 기반 레이어드 데이터 처리 구조
    architecture: Local Windows의 택시 CSV와 교통 속도 CSV를 VMware Linux 환경으로 전송한 뒤 HDFS에 적재하고, Spark 기반 Bronze-Silver-Gold-Platinum Layer로 원천 보존, 품질 정제, 피처 생성, 최종 지표 산출을 분리했습니다. 모든 중간 레이어는 Parquet으로 관리해 압축 효율과 처리 속도를 확보했습니다.
    development: PySpark와 Spark SQL로 CSV 스키마 추론, Null 제거, 음수 duration 제거, 15분 단위 time block 생성, pickup/dropoff borough 매핑, Taxi Zone Lookup 조인, TLI/CI 집계를 구현했습니다. 최종 분석용 Mart는 TLI_FINAL.csv와 CI_FINAL.csv 형태로 내보내 Python 분석과 대시보드 시각화에 연결했습니다.
    deployment: VMware Linux VM에 Hadoop HDFS 분석 환경을 구성하고 `/data` 기반 HDFS 경로를 설계했습니다. HDFS에서 처리된 Platinum Layer 결과를 VM 로컬로 가져온 뒤 Windows 환경으로 전송하고, 분산 Parquet 결과를 Pandas로 병합해 최종 CSV 산출물로 정리했습니다.
    troubleshooting: 기본 20GB VM 디스크로는 약 30GB 원천 데이터를 적재하기 어려워 업로드 실패와 permission denied 문제가 발생했습니다. VMware 디스크를 200GB로 확장하고 Linux 파티션 포맷, 마운트, 권한 설정, HDFS Data Directory 재설정을 진행해 안정적으로 대용량 데이터를 적재할 수 있게 했습니다.
    result: 약 30GB 원천 데이터를 분석 가능한 Mart로 정제하고, Borough/Hour/15분 Block 기준 TLI와 CI를 산출했습니다. 회귀 분석에서는 CI와 TLI의 단순 선형 관계가 낮게 나타나, TLI가 단순 혼잡도와는 다른 이동 시간 변동성 지표임을 확인했습니다.
    problem_visual:
      image: /assets/projects/nyc-taxi-big-data/slide-02.png
      title: Taxi Luck Project motivation
      caption: 동일한 이동 조건에서도 달라지는 택시 소요 시간을 Taxi Luck이라는 문제로 정의하고, TLI 지표로 정량화했습니다.
    metrics:
      - label: Raw Data
        value: 30GB
      - label: Storage
        value: 20GB -> 200GB
      - label: Data Layers
        value: 4 Layers
      - label: Indicators
        value: TLI / CI
    architecture_visual:
      image: /assets/projects/nyc-taxi-big-data/bd-architecture.png
      title: Big data processing architecture
      caption: Windows Local, VMware Linux, HDFS/Spark Cluster, Python 분석, Dashboard까지 이어지는 전체 데이터 처리 구조입니다.
    architecture_secondary_visual:
      image: /assets/projects/nyc-taxi-big-data/slide-08.png
      title: Spark layered architecture
      caption: Bronze, Silver, Gold Layer를 분리해 원천 보존, 정제, 최종 집계 흐름을 추적 가능하게 설계했습니다.
    architecture_extra_visuals:
      - image: /assets/projects/nyc-taxi-big-data/slide-14.png
        title: TLI and CI calculation
        caption: 소요 시간 표준편차와 평균을 이용한 TLI, 자유 속도 대비 평균 속도 기반 CI를 Spark SQL 집계로 산출했습니다.
    architecture_nodes:
      - icon: fa fa-database
        title: Data Sources
        body: NYC Yellow Taxi Trip Data, NYC Traffic Speed Data, Taxi Zone Lookup을 결합해 운행, 속도, 지역 정보를 함께 분석했습니다.
      - icon: fa fa-hdd-o
        title: HDFS Storage
        body: 대용량 원천 CSV를 HDFS에 적재하고 `/data` 하위 레이어 경로로 관리해 Spark 처리 기준 저장소를 구성했습니다.
      - icon: fa fa-filter
        title: Silver Cleaning
        body: Null 시간값, 음수 duration, 분석에 불필요한 fare 상세 컬럼을 제거해 가벼운 분석용 데이터셋으로 정제했습니다.
      - icon: fa fa-clock-o
        title: Time Blocking
        body: pickup 시각을 15분 단위 block으로 변환하고 hour, AM/PM, duration 파생 컬럼을 생성했습니다.
      - icon: fa fa-map-marker
        title: Borough Mapping
        body: PULocationID와 DOLocationID를 Taxi Zone Lookup과 조인해 Manhattan, Queens 같은 사람이 읽을 수 있는 지역 단위로 변환했습니다.
      - icon: fa fa-line-chart
        title: TLI / CI Mart
        body: Borough, Hour, Block 기준으로 이동 시간 변동성(TLI)과 혼잡도(CI)를 집계해 최종 분석용 Mart를 만들었습니다.
    troubleshooting_items:
      - icon: fa fa-hdd-o
        title: VM 저장공간 부족
        problem: 초기 VM 디스크 20GB로는 약 30GB Raw Data 업로드와 압축 해제, HDFS 적재를 동시에 처리하기 어려웠습니다.
        solution: VMware 디스크를 200GB로 확장하고 Linux 파티션 생성, 포맷, 마운트, 소유권 설정까지 진행해 HDFS 데이터 경로를 안정화했습니다.
      - icon: fa fa-lock
        title: Permission Denied
        problem: 확장 디스크와 HDFS Data Directory를 연결하는 과정에서 권한 문제로 파일 적재와 HDFS 서비스 동작이 막혔습니다.
        solution: 디렉터리 소유권과 권한을 재설정하고 HDFS 설정 경로를 수정해 Spark 처리 전 원천 데이터 적재가 가능하도록 정리했습니다.
      - icon: fa fa-compress
        title: 대용량 처리 최적화
        problem: CSV 그대로 처리하면 스캔 비용이 크고 불필요한 컬럼까지 반복 처리되어 Spark 작업 시간이 길어졌습니다.
        solution: 중간 산출물을 Parquet으로 변환하고 TLI 분석에 필요한 Location, Time, Speed 중심으로 컬럼을 줄여 처리 부담을 낮췄습니다.
      - icon: fa fa-area-chart
        title: 분석 해상도 한계
        problem: Borough 단위 분석은 공간 해상도가 넓어 CI와 TLI의 선형 관계를 명확하게 설명하기 어려웠습니다.
        solution: 결과를 한계까지 함께 정리하고, 향후 Zone/Road 단위 세분화와 Kafka/Airflow 기반 자동화 파이프라인을 개선 방향으로 제시했습니다.
