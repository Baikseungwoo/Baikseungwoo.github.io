      title: Chalkak technology stack
      caption: Android, TensorFlow Lite, Firebase, Node.js, Room DB, Firestore, Android Studio, Git, OpenAI API로 구성한 프로젝트 기술 스택입니다.
    architecture_nodes:
      - icon: fa fa-mobile
        title: Single Activity 구조
        body: MainActivity가 하단 내비게이션과 공통 UI를 담당하고, 학습·기록·퀴즈·설정 화면은 Fragment로 분리했습니다.
      - icon: fa fa-camera
        title: Camera / Gallery 입력
        body: Activity Result API와 FileProvider 기반 content URI를 사용해 카메라 촬영과 갤러리 이미지 선택 흐름을 안정적으로 연결했습니다.
      - icon: fa fa-database
        title: RoomDB + Firestore
        body: 학습 로그는 로컬 Room DB에 빠르게 저장하고, 사용자 정보와 토큰은 Firebase Firestore에 저장하는 구조로 관리했습니다.
      - icon: fa fa-cloud
        title: Firebase Backend
        body: Google Sign-In, Firebase Auth, FCM token, Cloud Functions를 활용해 인증·알림·GPT API 호출 흐름을 구성했습니다.
      - icon: fa fa-volume-up
        title: TTS / STT 학습
        body: Android TextToSpeech와 SpeechRecognizer를 활용해 단어를 듣고 직접 말하며 정확도를 확인할 수 있게 했습니다.
      - icon: fa fa-bolt
