  - title: OCT Retinal Disease Classification
    category: Deep Learning
    tone: deep
    detail_path: /projects/oct-retinal-classification/
    period: "2025.10~2025.11"
    role: 개인 프로젝트 / CNN 모델 설계 / 성능 비교
    summary: OCT 망막 이미지를 4개 클래스로 분류하고 SE-Residual 구조로 테스트 정확도를 약 99%까지 개선한 딥러닝 프로젝트입니다.
    problem: OCT 망막 이미지는 질환별 차이가 미세해 단순 CNN만으로는 클래스 간 혼동이 발생할 수 있어, 특징 추출 성능을 높이는 모델 구조가 필요했습니다.
    architecture: Baseline CNN과 SE-Residual 기반 개선 모델을 같은 데이터 분할과 학습 조건에서 비교하는 실험 구조로 설계했습니다.
    development: 학습 이미지를 Train/Validation으로 나누고 Grayscale, Resize, 정규화, RandomResizedCrop, Flip, Rotation 증강을 적용했습니다.
    deployment: 서비스 배포보다는 Jupyter Notebook 기반 실험 환경에서 모델 학습, 검증, 성능 지표 산출까지 재현 가능한 형태로 정리했습니다.
    troubleshooting: 시각적으로 유사한 CNV와 DME 간 오분류를 줄이기 위해 Residual Connection과 SE Block을 적용해 채널별 중요 특징에 집중하도록 개선했습니다.
    result: Baseline 약 94%에서 SE-Residual 개선 모델 약 99% 테스트 정확도를 달성하고 Confusion Matrix로 오분류 패턴을 분석했습니다.
    highlights:
      - OCT2017 데이터셋을 학습/검증/테스트 기준으로 구성하고 이미지 전처리와 증강을 적용했습니다.
      - Baseline CNN과 SE-Residual 기반 개선 모델을 동일 조건에서 비교했습니다.
      - Accuracy, Precision, Recall, F1-score, Confusion Matrix로 모델 성능을 분석했습니다.
    stack:
      - Python
      - PyTorch
      - CNN
      - Jupyter
      - CUDA/GPU
