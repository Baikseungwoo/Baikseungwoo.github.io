  - title: CampusShare
    category: Backend API
    tone: backend
    detail_path: /projects/campusshare/
    period: "2024.09~2024.12"
    role: Spring Boot API / JPA 설계 / Swagger 문서화
    summary: 강의 노트, 시험 자료, 과제 접근법을 공유하고 검색할 수 있는 학업 자료 공유 커뮤니티 CampusShare의 백엔드 API를 구현했습니다.
    overview_title: 강의 자료 공유와 Q&A를 하나의 API로
    problem: CampusShare는 학생들이 강의 자료와 시험 자료, 과제 접근법을 공유하며 후배들이 참고할 수 있는 기록을 남기는 학업 커뮤니티를 목표로 합니다. 이를 위해 게시판 CRUD, 키워드/카테고리 검색, 사용자 관리, Q&A 흐름을 안정적으로 처리할 수 있는 백엔드 API가 필요했습니다.
    problem_visual:
      image: /assets/projects/campusshare/campusshare-logo.png
      title: CampusShare logo
      caption: 학업 자료와 경험을 공유하는 커뮤니티 서비스라는 방향을 보여주는 CampusShare 프로젝트 로고입니다.
    architecture_label: System
    architecture_title: Spring Boot 기반 백엔드 아키텍처
    architecture: React 클라이언트와 Swagger UI가 REST API를 호출하고, Spring Boot 서버는 Controller, Service, Repository 계층을 거쳐 JPA Repository로 MySQL에 데이터를 저장하는 구조입니다. User, Share, Question, Answer 도메인을 분리해 게시판, 자료 공유, 질문/답변 기능을 확장 가능하게 설계했습니다.
    development: 게시글 생성, 수정, 삭제, 키워드/카테고리 검색, 자료 등록, 전체 조회, 다운로드 카운트 증가, 사용자 관리, 질문 등록, 답변 등록/조회/삭제 API를 구현했습니다. API 응답 구조를 일관되게 맞추고 Swagger 문서화를 적용해 React 프론트엔드 연동과 테스트가 쉽도록 구성했습니다.
    deployment: MySQL을 Docker Compose로 실행하고 Swagger/OpenAPI를 적용해 프론트엔드와 연동 가능한 API 문서를 제공했습니다.
    troubleshooting: 게시물, 질문, 답변, 사용자 간 연관관계를 명확히 나누고 응답 구조를 일관되게 정리해 프론트엔드 연동 혼선을 줄였습니다.
    result: 자료 공유와 Q&A를 포함한 핵심 백엔드 API를 구현하고, 문서화와 로컬 실행 환경을 통해 협업 편의성을 높였습니다.
    architecture_visual:
      image: /assets/projects/campusshare/campusshare-architecture.png
      title: CampusShare backend architecture
      caption: React Client, Swagger/API Client, Spring Boot REST API, JPA Repository, MySQL, Docker Compose, GitHub/IntelliJ 개발 환경을 한눈에 볼 수 있도록 직접 구성한 시스템 아키텍처입니다.
    architecture_nodes:
      - icon: fa fa-users
        title: User / Client
        body: 사용자는 React 화면에서 게시판, 자료 검색, 로그인, Q&A 기능을 이용하고 Swagger UI로 API 동작을 검증할 수 있습니다.
      - icon: fa fa-leaf
        title: Spring Boot API
        body: 게시글 CRUD, 키워드/카테고리 검색, 사용자 관리, 자료 공유, Q&A 요청을 REST API로 처리했습니다.
      - icon: fa fa-database
        title: JPA / MySQL
        body: User, Share, Question, Answer 엔티티를 JPA로 매핑하고 MySQL에 영속화했습니다.
      - icon: fa fa-file-text-o
        title: Swagger Docs
        body: API 명세를 Swagger/OpenAPI로 문서화해 요청/응답 확인과 프론트엔드 연동 편의성을 높였습니다.
      - icon: fa fa-cubes
        title: Docker Compose
        body: MySQL 실행 환경을 Docker Compose로 구성해 로컬 개발과 테스트 환경을 빠르게 재현할 수 있게 했습니다.
      - icon: fa fa-github
        title: GitHub Collaboration
        body: GitHub 기반으로 소스 코드를 관리하고 백엔드 API 변경사항을 추적했습니다.
    troubleshooting_items:
      - icon: fa fa-sitemap
        title: 도메인 관계 정리
        problem: 게시물, 질문, 답변, 사용자 간 연관관계가 섞이면 API 응답 구조가 복잡해지고 프론트엔드 연동이 어려워질 수 있었습니다.
        solution: User, Share, Question, Answer 도메인을 분리하고 계층별 책임을 명확히 나눠 응답 구조를 일관되게 정리했습니다.
      - icon: fa fa-file-text-o
        title: API 연동 혼선 감소
        problem: API 경로와 요청/응답 형식이 명확하지 않으면 프론트엔드와 백엔드 사이에서 테스트 비용이 커질 수 있었습니다.
        solution: Swagger/OpenAPI 문서를 적용해 API 사용 방법을 문서화하고 브라우저에서 바로 테스트할 수 있도록 만들었습니다.
      - icon: fa fa-database
        title: 로컬 DB 실행 환경
        problem: 팀원마다 MySQL 설치와 설정이 달라지면 로컬 실행 환경이 달라지는 문제가 발생할 수 있었습니다.
        solution: Docker Compose로 MySQL 실행 환경을 정의해 동일한 DB 환경에서 개발하고 테스트할 수 있게 했습니다.
    management_visual:
      image: /assets/projects/campusshare/campusshare-home.png
      title: CampusShare home and popular posts
      caption: README에 포함된 메인 화면입니다. 학년/학기 조건 검색, 인기 게시글, 랭킹 진입을 통해 학업 자료를 빠르게 탐색할 수 있습니다.
