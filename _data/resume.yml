education:
  title: Education
  intro: |-
    전공 학습과 연계 학위 과정을 통해 IT 서비스 기획, 개발, 데이터 활용 역량을 함께 쌓고 있습니다.
  items:
    - name: 서울과학기술대학교 - ITM 전공
      period: 재학 중
      description: |-
        산업공학부 ITM 전공 4학년으로, IT 서비스 구현과 비즈니스 관점의 문제 해결을 함께 학습하고 있습니다.
    - name: Northumbria University Newcastle - ITM
      period: 연계 학위 과정
      description: |-
        Information Technology Management 연계 학위 과정을 이수하며 영어로 모든 전공 수업, 프로젝트들을 수행하고 있습니다.

certification:
  title: Certification
  intro: |-
    보유 자격 및 어학 인증입니다.
  items:
    - name: Cos Pro Python 2급
      period: "2021.07.18"
      issuer: YBM
      description: |-
        Python 프로그래밍 역량을 평가하는 코딩 전문 자격증입니다.
    - name: IELTS - Overall Band Score 6.0
      period: "2024.11.19"
      issuer: British Council, IDP, Cambridge University
      description: |-
        영어 읽기, 듣기, 말하기, 쓰기 능력을 종합 평가하는 공인 영어 시험입니다.

curriculum:
  title: Training & Activities
  intro: |-
    외부 교육, 개발 커뮤니티, 학과 내 스터디 활동입니다.
  items:
    - name: Algorithm Panda World
      period: "2024.02~2024.09"
      organizer: 서울과학기술대학교 ITM 전공
      description: |-
        같은 학과 학생들과 자체적으로 동아리를 등록해 스터디에서 Java 기반 알고리즘 문제 풀이를 진행했습니다.
        주 1회 스터디, GitHub Pull Request 기반 코드 공유, 주차별 알고리즘 주제 발표와 코드 리뷰 흐름을 경험했습니다.
    - name: Operating System Study
      period: "2024.06~2024.08"
      organizer: 학과 자체 스터디
      description: |-
        학과 선배들과 운영체제 강의를 함께 수강하며 프로세스, 스레드, 메모리, 파일 시스템 등 핵심 개념을 학습했습니다.
        스터디원들과 개념 발표와 질의응답을 진행하고, 면접 관련 OS 질문을 준비해 답변을 연습했습니다.
    - name: Google Developer Groups
      period: "`24.09~`25.03"
      organizer: GDG Campus Korea
      description: |-
        Google 개발자 커뮤니티 활동을 통해 Spring Boot 백엔드 기술 학습과 프로젝트 경험을 공유했습니다.
    - name: "[IBMxRedHat] AI Transformation AX - Academy"
      period: "`26.02~`26.08"
      organizer: 대한상공회의소
      description: |-
        K-Digital 훈련과정으로 풀스택 개발 부터 머신러닝, 딥러닝, AI 프레임워크 개발까지 학습하였습니다.
        AWS 배포 플랫폼 활용에 대해서 학습하였고 프로젝트에 높은 수준으로 적용까지 경험했습니다.

